<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Teaching Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #00d9ff;
        }

        .header p {
            opacity: 0.7;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            color: #00d9ff;
            margin-bottom: 20px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Upload Section */
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.05);
        }

        .upload-area.dragover {
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.1);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #888;
            margin-bottom: 10px;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 8px;
            display: none;
        }

        .file-info.visible {
            display: block;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, #00d9ff 0%, #0066ff 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757 0%, #ff3838 100%);
        }

        /* Status indicators */
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .status.visible {
            display: block;
        }

        .status.success {
            background: rgba(39, 174, 96, 0.2);
            border: 1px solid #27ae60;
            color: #27ae60;
        }

        .status.error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        .status.loading {
            background: rgba(0, 217, 255, 0.2);
            border: 1px solid #00d9ff;
            color: #00d9ff;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00d9ff;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }

        /* Logs */
        .logs-container {
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
        }

        .log-entry {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: #888;
            font-size: 0.8rem;
        }

        .log-question {
            color: #00d9ff;
            margin: 5px 0;
        }

        .log-meta {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: #666;
        }

        .log-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .empty-logs {
            color: #666;
            text-align: center;
            padding: 30px;
        }

        /* Back link */
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00d9ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Progress bar */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.visible {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #0066ff);
            width: 0%;
            transition: width 0.3s;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Back to Chat</a>

    <div class="container">
        <div class="header">
            <h1>🔧 Admin Panel</h1>
            <p>Manage course materials and monitor system</p>
        </div>

        <div class="grid">
            <!-- Upload PDF Section -->
            <div class="card">
                <h2>📤 Upload Course Material</h2>
                
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">Drag & drop a PDF here or click to browse</div>
                    <input type="file" id="fileInput" accept=".pdf">
                </div>

                <div class="file-info" id="fileInfo">
                    <strong>Selected:</strong> <span id="fileName"></span>
                    <br><small id="fileSize"></small>
                </div>

                <button class="btn" id="uploadBtn" disabled>
                    <span class="btn-text">📤 Upload & Process</span>
                </button>

                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="status" id="uploadStatus"></div>
            </div>

            <!-- System Stats -->
            <div class="card">
                <h2>📊 System Statistics</h2>
                
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="totalSlides">-</div>
                        <div class="stat-label">Total Slides</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalQuestions">-</div>
                        <div class="stat-label">Questions Today</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="avgResponseTime">-</div>
                        <div class="stat-label">Avg Response (ms)</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="vectorDimensions">-</div>
                        <div class="stat-label">Vector Dimensions</div>
                    </div>
                </div>

                <button class="btn" id="refreshStats">🔄 Refresh Stats</button>
                <button class="btn btn-danger" id="reindexBtn">🔄 Re-index All</button>

                <div class="status" id="statsStatus"></div>
            </div>

            <!-- Recent Questions Log -->
            <div class="card" style="grid-column: 1 / -1;">
                <h2>📜 Recent Questions</h2>
                
                <div class="logs-container" id="logsContainer">
                    <div class="empty-logs">Loading logs...</div>
                </div>

                <button class="btn" id="refreshLogs">🔄 Refresh Logs</button>
                <button class="btn btn-danger" id="clearLogs">🗑️ Clear Logs</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
